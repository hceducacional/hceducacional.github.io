    <radialGradient id="glow" cx=".55" cy=".3" r=".6">
      <stop offset="0" stop-color="#f3d9b8" stop-opacity=".55"/><stop offset="1" stop-color="#f3d9b8" stop-opacity="0"/>
    </radialGradient>
    <path id="arc" d="M1100,120 A140,140 0 0 1 1230,350"/>
  </defs>
  <rect width="1597" height="420" fill="url(#bg)"/>
  <polygon points="0,0 1160,0 1080,420 0,420" fill="#0a3478" opacity=".55"/>
  <!-- área "foto" à esquerda -->
  <polygon points="0,0 700,0 910,420 0,420" fill="url(#photo)"/>
  <polygon points="0,0 700,0 910,420 0,420" fill="url(#glow)"/>
  <g opacity=".35">
    <circle cx="120" cy="120" r="70" fill="#d8b38a"/>
    <circle cx="330" cy="150" r="58" fill="#c79b74"/>
    <circle cx="560" cy="110" r="64" fill="#b8865f"/>
