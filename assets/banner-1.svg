<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1597 420" width="1597" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3d91"/><stop offset="1" stop-color="#0b55c2"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2433"/><stop offset=".6" stop-color="#3b4658"/><stop offset="1" stop-color="#5b6576"/>
