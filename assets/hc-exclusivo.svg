<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1597 420" width="1597" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2683f"/><stop offset=".55" stop-color="#e2475a"/><stop offset="1" stop-color="#f39a5b"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2a5c" stop-opacity="0"/><stop offset=".5" stop-color="#3b2a5c" stop-opacity=".75"/><stop offset="1" stop-color="#3b2a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd29a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd29a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd29a" stop-opacity="0"/>
