    <rect x="610" y="-40" width="160" height="520" fill="url(#light)"/>
    <rect x="900" y="-40" width="70" height="520" fill="url(#streak)"/>
    <rect x="1160" y="-40" width="140" height="520" fill="url(#streak)"/>
    <rect x="1380" y="-40" width="120" height="520" fill="url(#light)"/>
    <rect x="1640" y="-40" width="80" height="520" fill="url(#streak)"/>
